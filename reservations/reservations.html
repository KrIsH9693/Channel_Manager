<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Reservation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      background: #f5f7fb;
    }
    .card {
      border-radius: 14px;
    }
  </style>
</head>

<body>

<div class="container py-4">

  <h3 class="mb-4 fw-semibold">Create Reservation</h3>

  <div class="card shadow-sm border-0">
    <div class="card-body">

      <div class="row g-3">

        <!-- Guest -->
        <div class="col-md-4">
          <label class="form-label">Guest Name</label>
          <input
            type="text"
            id="guestName"
            class="form-control"
            placeholder="Enter guest name"
          />
        </div>

        <!-- OTA -->
        <div class="col-md-4">
          <label class="form-label">OTA</label>
          <select id="otaSelect" class="form-select"></select>
        </div>

        <!-- Property -->
        <div class="col-md-4">
          <label class="form-label">Property</label>
          <select id="propertySelect" class="form-select"></select>
        </div>

        <!-- Room Type -->
        <div class="col-md-4">
          <label class="form-label">Room Type</label>
          <select id="roomTypeSelect" class="form-select"></select>
        </div>

        <!-- Room No -->
        <div class="col-md-4">
          <label class="form-label">Room No</label>
          <select id="roomNoSelect" class="form-select">
            <option value="">Select Room</option>
          </select>
        </div>

        <!-- Check In -->
        <div class="col-md-2">
          <label class="form-label">Check-In</label>
          <input
            type="date"
            id="checkIn"
            class="form-control"
          />
        </div>

        <!-- Check Out -->
        <div class="col-md-2">
          <label class="form-label">Check-Out</label>
          <input
            type="date"
            id="checkOut"
            class="form-control"
          />
        </div>

      </div>

      <hr class="my-4">

      <div class="text-end">
        <button
          class="btn btn-primary px-4"
          onclick="createReservation()"
        >
          Create Reservation
        </button>
      </div>

    </div>
  </div>

</div>

<!-- JS FILES -->
<script src="/assets/js/auth.js"></script>
<script src="/reservations/js/reservations.js"></script>

</body>
</html>
