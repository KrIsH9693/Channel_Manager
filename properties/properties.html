<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Properties</h4>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#propertyModal">
    + Add Property
  </button>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>City</th>
          <th>Total Rooms</th>
          <th>Status</th>
          <th width="160">Action</th>
        </tr>
      </thead>
      <tbody id="propertyTable"></tbody>
    </table>
  </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="propertyModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Property</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="propertyId">

        <div class="mb-2">
          <label class="form-label">Property Name</label>
          <input id="propertyName" class="form-control">
        </div>

        <div class="mb-2">
          <label class="form-label">City</label>
          <input id="propertyCity" class="form-control">
        </div>

        <div class="mb-2">
          <label class="form-label">Total Rooms</label>
          <input id="propertyRooms" type="number" class="form-control">
        </div>

        <div class="mb-2">
          <label class="form-label">Status</label>
          <select id="propertyStatus" class="form-select">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="saveProperty()">Save</button>
      </div>
    </div>
  </div>
</div>
<script src="/assets/js/auth.js"></script>
