<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

  <h3 class="mb-4">Inventory Reports</h3>

  <!-- FILTER -->
  <div class="row g-3 align-items-end mb-4">
    <div class="col-md-4">
      <label class="form-label">From Date</label>
      <input type="date" id="fromDate" class="form-control">
    </div>

    <div class="col-md-4">
      <label class="form-label">To Date</label>
      <input type="date" id="toDate" class="form-control">
    </div>

    <div class="col-md-4">
      <button class="btn btn-primary w-100" onclick="generateReport()">
        Generate Report
      </button>
    </div>
  </div>
  <div class="row g-3 mb-4">
  <div class="col-md-6">
    <button class="btn btn-outline-success w-100" onclick="exportExcel()">
      Export Excel
    </button>
  </div>
  <div class="col-md-6">
    <button class="btn btn-outline-danger w-100" onclick="exportPDF()">
      Export PDF
    </button>
  </div>
</div>

  <!-- SUMMARY CARDS -->
  <div class="row g-4 mb-4">
    <div class="col-md-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="text-muted">Total Rooms</h6>
          <h4 id="repTotalRooms">0</h4>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="text-muted">Blocked Room Nights</h6>
          <h4 id="repBlocked">0</h4>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="text-muted">Occupancy %</h6>
          <h4 id="repOcc">0%</h4>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="text-muted">Potential Revenue</h6>
          <h4 id="repRevenue">₹0</h4>
        </div>
      </div>
    </div>
  </div>

  <!-- CHART -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5>Daily Revenue</h5>
      <canvas id="reportChart"></canvas>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card shadow-sm">
    <div class="card-body">
      <h5>Daily Breakdown</h5>
      <table class="table table-sm mt-3">
        <thead>
          <tr>
            <th>Date</th>
            <th>Blocked Rooms</th>
            <th>Revenue</th>
          </tr>
        </thead>
        <tbody id="reportTable"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="reports/js/reports.js"></script>
<script src="/assets/js/auth.js"></script>
<!-- EXPORT LIBRARIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</body>
</html>
