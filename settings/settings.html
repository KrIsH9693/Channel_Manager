<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

  <!-- PROFILE -->
  <div class="card shadow mb-4">
    <div class="card-header bg-dark text-white">Profile Settings</div>
    <div class="card-body">
      <form id="profileForm">
        <input id="ownerName" class="form-control mb-2" placeholder="Owner Name">
        <input id="hotelName" class="form-control mb-2" placeholder="Hotel Name">
        <input id="email" class="form-control mb-2" readonly>
        <input id="phone" class="form-control mb-3" placeholder="Phone">

        <button class="btn btn-primary w-100">Update Profile</button>
      </form>

      <button class="btn btn-danger w-100 mt-3"
              data-bs-toggle="modal"
              data-bs-target="#passwordModal">
        Change Password
      </button>
    </div>
  </div>

  <!-- JSON PREVIEW -->
  <div class="card shadow">
    <div class="card-header bg-secondary text-white">User JSON</div>
    <div class="card-body">
      <pre id="userJson" class="bg-light p-3 rounded"></pre>
    </div>
  </div>
</div>

<!-- PASSWORD MODAL -->
<div class="modal fade" id="passwordModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Change Password</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input id="oldPassword" class="form-control mb-2" placeholder="Old Password" type="password">
        <input id="newPassword" class="form-control mb-2" placeholder="New Password" type="password">
        <input id="confirmPassword" class="form-control" placeholder="Confirm Password" type="password">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger" onclick="changePassword()">Update</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/settings.js"></script>

</body>
</html>
