<!-- HTML structure -->
<button id="addOtaBtn" class="btn btn-primary">Add OTA</button>

<table id="otaTable" class="table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Properties</th>
      <th>Room Types</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<!-- OTA Modal -->
<div class="modal fade" id="otaModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">OTA</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="otaId">
        <div class="mb-3">
          <label>Name</label>
          <input type="text" id="otaName" class="form-control">
        </div>
        <div class="mb-3">
          <label>Status</label>
          <select id="otaStatus" class="form-select">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
        <div class="mb-3">
          <label>Properties</label>
          <div id="propertyCheckboxes"></div>
        </div>
        <div class="mb-3">
          <label>Room Types</label>
          <div id="roomTypeCheckboxes"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="saveOtaBtn" class="btn btn-primary">Save</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      </div>
    </div>
  </div>
</div>
