<div class="d-flex justify-content-between mb-3">
  <h4>OTA Management</h4>
  <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#otaModal">
    + Add OTA
  </button>
</div>

<table class="table table-bordered align-middle">
  <thead class="table-light">
    <tr>
      <th>Name</th>
      <th>Properties</th>
      <th>Room Types</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="otaTable"></tbody>
</table>

<!-- OTA MODAL -->
<div class="modal fade" id="otaModal">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">OTA</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <input type="hidden" id="otaId">

        <div class="mb-2">
          <label>OTA Name</label>
          <input id="otaName" class="form-control">
        </div>

        <div class="mb-2">
          <label>Status</label>
          <select id="otaStatus" class="form-select">
            <option>Active</option>
            <option>Inactive</option>
          </select>
        </div>

        <div class="mb-2">
          <label>Map Properties</label>
          <div id="propertyCheckboxes"></div>
        </div>

        <div class="mb-2">
          <label>Map Room Types</label>
          <div id="roomTypeCheckboxes"></div>
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-dark" onclick="saveOTA()">Save OTA</button>
      </div>

    </div>
  </div>
</div>
<script src="/assets/js/auth.js"></script>
