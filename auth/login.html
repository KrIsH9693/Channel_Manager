<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Channel Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center vh-100">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-4">

      <div class="card shadow">
        <div class="card-body">
          <h4 class="text-center mb-3">Login</h4>

          <input id="loginEmail" type="email" class="form-control mb-2" placeholder="Email">
          <input id="loginPassword" type="password" class="form-control mb-3" placeholder="Password">

          <button class="btn btn-primary w-100 mb-2" onclick="loginUser()">Login</button>

          <!-- <button type="button" onclick="loginUser()">Login</button> -->
          <a href="register.html">Register</a>
          <a href="#" onclick="resetPassword()">Forgot password?</a>

          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script type="module">
  import { loginUser } from "./js/auth.js";
  window.loginUser = loginUser;
</script>

</body>
</html>
