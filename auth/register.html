<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | Channel Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center vh-100">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-4">

      <div class="card shadow">
        <div class="card-body">
          <h4 class="text-center mb-3">Register</h4>

          <input id="owner" class="form-control mb-2" placeholder="Owner Name">
          <input id="hotel" class="form-control mb-2" placeholder="Hotel Name">
          <input id="email" type="email" class="form-control mb-2" placeholder="Email">
          <input id="phone" type="tel" class="form-control mb-2" placeholder="Phone Number">
          <input id="password" type="password" class="form-control mb-3" placeholder="Password">


          <button class="btn btn-success w-100 mb-2" onclick="registerUser()">
            Register
          </button>

          <div class="text-center">
            <a href="login.html">Already registered? Login</a>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script type="module">
  import { registerUser } from "./js/auth.js";
  window.registerUser = registerUser;
</script>

</body>
</html>
